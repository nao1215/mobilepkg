version: 2
project_name: mobilepkg
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
    - sh -c 'GOROOT="$(go env GOROOT)" CGO_ENABLED=0 GOOS=linux go-licenses save ./cmd/mobilepkg --save_path=third_party_licenses/linux --force'
    - sh -c 'GOROOT="$(go env GOROOT)" CGO_ENABLED=0 GOOS=windows go-licenses save ./cmd/mobilepkg --save_path=third_party_licenses/windows --force'
    - sh -c 'GOROOT="$(go env GOROOT)" CGO_ENABLED=0 GOOS=darwin go-licenses save ./cmd/mobilepkg --save_path=third_party_licenses/darwin --force'
builds:
  - main: ./cmd/mobilepkg
    ldflags:
      - -s -w -X github.com/nao1215/mobilepkg/internal/cmdinfo.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    # Listing files replaces goreleaser's defaults, so the project's own
    # LICENSE, README and CHANGELOG are named here too.
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - src: "third_party_licenses/{{ .Os }}/**/*"
        dst: THIRD_PARTY_LICENSES
checksum:
  name_template: "checksums.txt"
# Software Bill of Materials (SPDX, generated by syft) for every release archive.
sboms:
  - artifacts: archive
# Keyless artifact signing with cosign. Signing the checksums file transitively
# covers every published archive and package.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
nfpms:
  - maintainer: 'Naohiro CHIKAMATSU <n.chika156@gmail.com>'
    description: mobilepkg - Inspect and analyze mobile application packages
    homepage: https://github.com/nao1215/mobilepkg
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    contents:
      - src: ./third_party_licenses/linux
        dst: /usr/share/doc/mobilepkg/THIRD_PARTY_LICENSES
        type: tree

# A Homebrew cask is deliberately absent: it would push to nao1215/homebrew-tap,
# which needs a TAP_GITHUB_TOKEN secret this repository does not have.
