version: 2
project_name: mobilepkg
env:
  - GO111MODULE=on
before:
  hooks:
    - go mod tidy
builds:
  - main: ./cmd/mobilepkg
    ldflags:
      - -s -w -X github.com/nao1215/mobilepkg/internal/cmdinfo.Version=v{{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: "checksums.txt"
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
nfpms:
  - maintainer: 'Naohiro CHIKAMATSU <n.chika156@gmail.com>'
    description: mobilepkg - Inspect and analyze mobile application packages
    homepage: https://github.com/nao1215/mobilepkg
    license: MIT
    formats:
      - deb
      - rpm
      - apk

# The bucket lives in this repository, so `scoop bucket add nao1215-mobilepkg
# https://github.com/nao1215/mobilepkg` works without a separate bucket repo and
# GoReleaser can push the manifest with the built-in GITHUB_TOKEN. A Homebrew
# cask is deliberately absent: it would push to nao1215/homebrew-tap, which needs
# a TAP_GITHUB_TOKEN secret this repository does not have.
scoops:
  - name: mobilepkg
    repository:
      owner: nao1215
      name: mobilepkg
      branch: main
    directory: bucket
    homepage: "https://github.com/nao1215/mobilepkg"
    description: "Inspect and analyze Android and iOS application packages"
    license: MIT
    commit_msg_template: "chore(scoop): update the bucket manifest for {{ .Tag }}"
