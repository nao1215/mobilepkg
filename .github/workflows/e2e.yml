name: E2E

# mobilepkg's end-to-end suite drives the real binary through atago against the
# committed AndroGoat fixture. It used to run on Linux only, which left the
# platform differences that actually affect a file-inspection CLI -- Windows'
# .exe suffix, path separators and CRLF handling; macOS' own path rules --
# covered by unit tests alone.
#
# All three operating systems run every spec on every pull request. mobilepkg is
# hermetic (it parses a package file in-process: no Android SDK, Xcode, device or
# network), so there is nothing platform-specific to gate off and no reason to
# demote a leg to a scheduled-only drift check -- a leg that runs only after
# merge tells you about a break when it is already on main.
#
# The bootstrap is `go run ./e2e/runner`, not a shell script: the Windows leg
# must not depend on Git for Windows being installed, or it would be testing the
# runner image rather than mobilepkg. For the same reason no spec shells out or
# reads a host environment variable; fixtures arrive through atago `fixture`
# steps and redirection through `stdout_to`.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (atago, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The suite finishes in well under a minute; the cap is there so a hung
    # scenario fails instead of burning a job's full six hours.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install atago
        uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          version: v0.21.0

      - name: Run end-to-end tests
        run: go run ./e2e/runner
