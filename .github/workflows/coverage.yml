name: Coverage

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# octocov reads/writes the Actions-artifact datastore (diff/report in
# .octocov.yml) and comments coverage on pull requests; contents:write lets the
# push-to-main run commit the regenerated coverage badge back.
permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  coverage:
    name: Coverage (unit + e2e)

    strategy:
      matrix:
        platform: [ubuntu-latest]

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # The combined coverage runs the self-hosted atago E2E suite against a
      # `go build -cover` mobilepkg and merges its covdata with the unit-test
      # covdata (see scripts/coverage.sh). The E2E is fully hermetic, so atago
      # is the only extra dependency.
      - name: Install atago
        uses: nao1215/setup-atago@e4b6719aea547a68e6c15252222babab7f492a88 # v0.1.1
        with:
          version: v0.21.0

      - name: Run combined unit + E2E coverage
        run: make coverage

      - uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2

      # On push to main, commit the octocov-regenerated coverage badge back so
      # the README badge stays current. `[skip ci]` prevents a workflow loop.
      - name: Commit coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- doc/coverage.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add doc/coverage.svg
            git commit -m "chore(coverage): update coverage badge [skip ci]"
            git push
          else
            echo "coverage badge unchanged"
          fi
