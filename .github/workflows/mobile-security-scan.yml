name: Mobile Security Scan

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: "Path to the mobile package file (APK/IPA/AAB)"
        required: true
        type: string
      baseline_path:
        description: "Path to baseline report.json (optional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Build mobilepkg
        run: make build

      - name: Inspect mobile package
        # The inputs reach the script through env rather than being expanded
        # into it, so a path cannot inject shell syntax.
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
          BASELINE_PATH: ${{ inputs.baseline_path }}
        run: |
          args=()
          if [ -n "$BASELINE_PATH" ]; then
            args=(--baseline "$BASELINE_PATH")
          fi
          ./mobilepkg inspect "${args[@]}" "$ARTIFACT_PATH" > report.json
          ./mobilepkg inspect "${args[@]}" --format markdown "$ARTIFACT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobilepkg-report
          path: report.json
