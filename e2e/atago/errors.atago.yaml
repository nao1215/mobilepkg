# mobilepkg error handling: bad usage, missing files, unknown formats, and
# unrecognized package contents must fail with a nonzero exit and a message on
# stderr (stdout stays clean for pipelines). Run with:
#   make e2e   (or go run ./e2e/runner)
version: "1"

suite:
  name: mobilepkg error handling

scenarios:
  - name: inspect with no file prints usage and fails
    steps:
      - run:
          command: mobilepkg inspect
      - assert:
          exit_code: { not: 0 }
          stderr:
            contains: "Usage: mobilepkg inspect"

  # The tail of this message is the operating system's, not mobilepkg's: Go
  # surfaces "no such file or directory" on Unix and "The system cannot find the
  # file specified." on Windows. What mobilepkg owns -- and what this asserts --
  # is that the failure is attributed to the tool and names the file the user
  # asked for.
  - name: inspect on a missing file fails
    steps:
      - run:
          command: mobilepkg inspect does_not_exist.apk
      - assert:
          exit_code: { not: 0 }
          stderr:
            contains:
              - "mobilepkg inspect: open"
              - "does_not_exist.apk"

  - name: inspect rejects an unknown output format
    steps:
      - fixture:
          file: app.apk
          from: ../../testdata/android/androgoat_rich.apk
      - run:
          command: mobilepkg inspect --format xml app.apk
      - assert:
          exit_code: { not: 0 }
          stderr:
            contains: "unknown format"

  - name: inspect rejects a file that is not a mobile package
    steps:
      - fixture:
          file: notapkg.apk
          content: "this is not a zip archive"
      - run:
          command: mobilepkg inspect notapkg.apk
      - assert:
          exit_code: { not: 0 }
          stderr:
            contains: "unsupported package format"
