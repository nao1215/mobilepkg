# yaml-language-server: $schema=https://raw.githubusercontent.com/nao1215/himorime/main/schema/himorime.schema.json
#
# mobilepkg measured end to end with himorime (https://github.com/nao1215/himorime):
# the process a user starts, from its first instruction to its exit.
#
#   make bench          measure the working tree
#   make bench-compare  compare main with the working tree
#
# On a pull request, .github/workflows/bench.yml runs `himorime ci bench`:
# the base of the pull request and its head are built and measured in
# interleaved rounds on the same runner. See bench/README.md.
#
# The packages are generated by gen.sh before measuring, from the committed
# testdata/android/androgoat_rich.apk and a synthetic classes.dex. Both
# revisions run the working tree's gen.sh (${head_root}), so they read the
# same bytes. Nothing is downloaded.
version: "1"

name: mobilepkg
description: Start-up, inspecting and comparing APKs whose DEX holds 10 and 100 000 strings, and inspecting a file that is not a package.

build:
  command: [go, build, -trimpath, -o, "${artifact}", ./cmd/mobilepkg]
  cwd: ..

defaults:
  warmup: 2
  runs: 20
  # No HOME or XDG directories: mobilepkg reads no configuration, cache or
  # environment variable and writes only to standard output. An env here
  # would also reach the setup hooks, whose go run needs the user's own Go
  # module and build caches.
  metrics:
    cpu: true
    memory: true
  regression:
    confidence: 0.95
    latency:
      max_percent: 10
      min_difference: 1ms
    cpu_total:
      max_percent: 15
      min_difference: 2ms
    peak_rss:
      max_percent: 15
      min_difference: 2MiB

benchmarks:
  - name: version
    description: Starting mobilepkg and exiting.
    tags: [smoke]
    commands:
      mobilepkg:
        command: ["${artifact}", version]

  - name: inspect 10
    description: >-
      An APK whose DEX holds 10 strings, written as JSON and as Markdown, and
      checked with --fail-on warn, which exits 1 on its findings. Start-up,
      the manifest, the signature and the resources dominate.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", apk, "10", "${workdir}/app.apk"]
    baseline: json
    commands:
      json:
        command: ["${artifact}", inspect, "${workdir}/app.apk"]
      markdown:
        command: ["${artifact}", inspect, --format, markdown, "${workdir}/app.apk"]
      fail-on:
        command: ["${artifact}", inspect, --fail-on, warn, "${workdir}/app.apk"]
        exit_codes: [1]

  - name: inspect 100k
    description: >-
      An APK whose DEX holds 100 000 strings, one in a hundred a cleartext
      URL: the DEX scanners over every string, the findings, and each output.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", apk, "100000", "${workdir}/app.apk"]
    baseline: json
    metrics:
      throughput:
        work: {value: 100000, unit: strings}
    commands:
      json:
        command: ["${artifact}", inspect, "${workdir}/app.apk"]
      markdown:
        command: ["${artifact}", inspect, --format, markdown, "${workdir}/app.apk"]
      fail-on:
        command: ["${artifact}", inspect, --fail-on, warn, "${workdir}/app.apk"]
        exit_codes: [1]

  - name: compare 10
    description: Two APKs whose DEX holds 10 different strings each, both inspected and compared.
    tags: [smoke]
    setup:
      - command: [sh, "${head_root}/gen.sh", apk, "10", "${workdir}/old.apk"]
      - command: [sh, "${head_root}/gen.sh", apk, "10", "${workdir}/new.apk", "1000"]
    commands:
      mobilepkg:
        command: ["${artifact}", compare, "${workdir}/old.apk", "${workdir}/new.apk"]

  - name: compare 100k
    description: Two APKs whose DEX holds 100 000 strings each, 90 000 of them shared, both inspected and compared.
    tags: [large]
    setup:
      - command: [sh, "${head_root}/gen.sh", apk, "100000", "${workdir}/old.apk"]
      - command: [sh, "${head_root}/gen.sh", apk, "100000", "${workdir}/new.apk", "10000"]
    metrics:
      throughput:
        work: {value: 200000, unit: strings}
    commands:
      mobilepkg:
        command: ["${artifact}", compare, "${workdir}/old.apk", "${workdir}/new.apk"]

  - name: inspect error
    description: A file that is not a package, rejected with exit 1.
    tags: [smoke]
    setup:
      - command: [sh, -c, 'printf "not a package\n" > "$1"', sh, "${workdir}/broken.apk"]
    exit_codes: [1]
    commands:
      mobilepkg:
        command: ["${artifact}", inspect, "${workdir}/broken.apk"]
